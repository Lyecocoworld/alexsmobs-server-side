# TUSKLIN — Skills

tusklin_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

tusklin_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

tusklin_on_hurt:
  Skills: []

tusklin_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.tusklin.die;v=1.0;p=0.8-1.2} @self
