# FRILLED SHARK — Skills

frilled_shark_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

frilled_shark_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

frilled_shark_on_hurt:
  Skills: []

frilled_shark_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.frilled_shark.die;v=1.0;p=0.8-1.2} @self
