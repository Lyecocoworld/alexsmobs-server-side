# ===============================================================
# GORILLA (Alex's Mobs)
# Classification: C2 (tamable)
# HP=30 DMG=7 SPD=0.25
# ===============================================================
gorilla:
  Type: silverfish
  Display: '&fGorilla'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 30
  Damage: 7
  MovementSpeed: 0.25
  KnockbackResistance: 0.3
  Faction: creature_gorilla
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - gorilla_ai
  AITargetSelectors:
    - clear
    - gorilla_targets
  Drops:
    - gorilla_drops
  Skills:
    - onTimer:10
    - skill:gorilla_tick @self
    - onSpawn:
      - skill:gorilla_init @self
    - onDeath:
      - skill:gorilla_death @self
    - onDamaged:
      - skill:gorilla_on_hurt @self
    - onInteract:
      - skill:gorilla_on_interact @self
