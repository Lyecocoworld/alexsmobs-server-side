# GORILLA — BetterModel

model:
  bettermodel_id: "alexsmobs:gorilla"
  type: "silverfish"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/gorilla.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/gorilla.png"
  animations:
    idle: "animation.gorilla.idle"
    walk: "animation.gorilla.walk"
    run: "animation.gorilla.run"
    sit: "animation.gorilla.sit"
    death: "animation.gorilla.death"
    breakblock_r: "animation.gorilla.breakblock_r"
    breakblock_l: "animation.gorilla.breakblock_l"
    poundchest: "animation.gorilla.poundchest"
    attack: "animation.gorilla.attack"

  animation_state_mapping:
    idle: {"animation": "idle", "texture": "normal", "loop": true}
    walk: {"animation": "walk", "texture": "normal", "loop": true}
    run: {"animation": "run", "texture": "normal", "loop": true}
    sit: {"animation": "sit", "texture": "normal", "loop": true}
    death: {"animation": "death", "texture": "normal", "loop": true}
    breakblock_r: {"animation": "breakblock_r", "texture": "normal", "loop": false, "duration": 20}
    breakblock_l: {"animation": "breakblock_l", "texture": "normal", "loop": false, "duration": 20}
    poundchest: {"animation": "poundchest", "texture": "normal", "loop": false, "duration": 40}
    attack: {"animation": "attack", "texture": "normal", "loop": false, "duration": 20}

  scale:
    adult: 1.0
    baby: 0.5
