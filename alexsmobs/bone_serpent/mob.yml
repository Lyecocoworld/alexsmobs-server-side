# ===============================================================
# BONE SERPENT (Alex's Mobs)
# HP=25 DMG=5 SPD=1.45
# ===============================================================
bone_serpent:
  Type: silverfish
  Display: '&fBone Serpent'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 25
  Damage: 5
  MovementSpeed: 1.45
  Faction: creature_bone_serpent
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - bone_serpent_ai
  AITargetSelectors:
    - clear
    - bone_serpent_targets
  Drops:
    - bone_serpent_drops
  Skills:
    - onTimer:10
    - skill:bone_serpent_tick @self
    - onSpawn:
      - skill:bone_serpent_init @self
    - onDeath:
      - skill:bone_serpent_death @self
    - onDamaged:
      - skill:bone_serpent_on_hurt @self
