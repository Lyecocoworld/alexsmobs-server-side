# ENDERIOPHAGE — Spawn

enderiophage_spawner:
  Type: enderiophage
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=END_BARRENS,END_HIGHLANDS,END_MIDLANDS,SMALL_END_ISLANDS,THE_END}
    - height{h=0to100}
    - lightlevel{l=0to15}
    - worldtype{wt=END}
    - blocktype{m=END_STONE,PURPUR_BLOCK} @origin
    - playerdistance{d=>24}
