# ===============================================================
# SOUL VULTURE (Alex's Mobs)
# HP=16 DMG=4 SPD=0.3
# ===============================================================
soul_vulture:
  Type: vex
  Display: '&fSoul Vulture'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 16
  Damage: 4
  MovementSpeed: 0.3
  Faction: creature_soul_vulture
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - soul_vulture_ai
  AITargetSelectors:
    - clear
    - soul_vulture_targets
  Drops:
    - soul_vulture_drops
  Skills:
    - onTimer:10
    - skill:soul_vulture_tick @self
    - onSpawn:
      - skill:soul_vulture_init @self
    - onDeath:
      - skill:soul_vulture_death @self
    - onDamaged:
      - skill:soul_vulture_on_hurt @self
