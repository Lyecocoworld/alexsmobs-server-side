# MIMICUBE — BetterModel

model:
  bettermodel_id: "alexsmobs:mimicube"
  type: "slime"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/mimicube.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/mimicube.png"
  animations:
    idle: "animation.mimicube.idle"
    walk: "animation.mimicube.walk"
    run: "animation.mimicube.run"
    sit: "animation.mimicube.sit"
    death: "animation.mimicube.death"

  animation_state_mapping:
    idle: {"animation": "idle", "texture": "normal", "loop": true}
    walk: {"animation": "walk", "texture": "normal", "loop": true}
    run: {"animation": "run", "texture": "normal", "loop": true}
    sit: {"animation": "sit", "texture": "normal", "loop": true}
    death: {"animation": "death", "texture": "normal", "loop": true}

  scale:
    adult: 1.0
    baby: 0.5
