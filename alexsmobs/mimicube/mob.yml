# ===============================================================
# MIMICUBE (Alex's Mobs)
# Classification: C1
# HP=30 DMG=2 SPD=0.45
# ===============================================================
mimicube:
  Type: slime
  Display: '&fMimicube'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 30
  Damage: 2
  MovementSpeed: 0.45
  Faction: creature_mimicube
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - mimicube_ai
  AITargetSelectors:
    - clear
    - mimicube_targets
  Drops:
    - mimicube_drops
  Skills:
    - onTimer:10
    - skill:mimicube_tick @self
    - onSpawn:
      - skill:mimicube_init @self
    - onDeath:
      - skill:mimicube_death @self
    - onDamaged:
      - skill:mimicube_on_hurt @self
