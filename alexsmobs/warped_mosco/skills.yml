# WARPED MOSCO — Skills

warped_mosco_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

warped_mosco_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

warped_mosco_on_hurt:
  Skills: []

warped_mosco_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.warped_mosco.die;v=1.0;p=0.8-1.2} @self
