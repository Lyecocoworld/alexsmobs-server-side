# BISON — Skills

bison_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

bison_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

bison_on_hurt:
  Skills: []

bison_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.bison.die;v=1.0;p=0.8-1.2} @self
