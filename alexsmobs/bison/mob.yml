# ===============================================================
# BISON (Alex's Mobs)
# HP=40 DMG=7 SPD=0.25
# ===============================================================
bison:
  Type: cow
  Display: '&fBison'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 40
  Damage: 7
  MovementSpeed: 0.25
  Faction: creature_bison
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - bison_ai
  AITargetSelectors:
    - clear
    - bison_targets
  Drops:
    - bison_drops
  Skills:
    - onTimer:10
    - skill:bison_tick @self
    - onSpawn:
      - skill:bison_init @self
    - onDeath:
      - skill:bison_death @self
    - onDamaged:
      - skill:bison_on_hurt @self
