# SNOW LEOPARD — Spawn

snow_leopard_spawner:
  Type: snow_leopard
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=SNOWY_PLAINS,ICE_SPIKES,SNOWY_TAIGA,GROVE,SNOWY_SLOPES,JAGGED_PEAKS}
    - height{h=60to200}
    - lightlevel{l=0to15}
    - worldtype{wt=OVERWORLD}
    - blocktype{m=SNOW_BLOCK,STONE,ICE} @origin
    - playerdistance{d=>24}
