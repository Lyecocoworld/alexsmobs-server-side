# ===============================================================
# SNOW LEOPARD (Alex's Mobs)
# Classification: C1
# HP=30 DMG=6 SPD=0.35
# ===============================================================
snow_leopard:
  Type: ocelot
  Display: '&fSnow Leopard'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 30
  Damage: 6
  MovementSpeed: 0.35
  Faction: creature_snow_leopard
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - snow_leopard_ai
  AITargetSelectors:
    - clear
    - snow_leopard_targets
  Drops:
    - snow_leopard_drops
  Skills:
    - onTimer:10
    - skill:snow_leopard_tick @self
    - onSpawn:
      - skill:snow_leopard_init @self
    - onDeath:
      - skill:snow_leopard_death @self
    - onDamaged:
      - skill:snow_leopard_on_hurt @self
