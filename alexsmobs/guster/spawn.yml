# GUSTER — Spawn

guster_spawner:
  Type: guster
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=DESERT,BADLANDS,ERODED_BADLANDS}
    - height{h=60to150}
    - lightlevel{l=0to15}
    - worldtype{wt=OVERWORLD}
    - blocktype{m=SAND,RED_SAND,SANDSTONE} @origin
    - playerdistance{d=>24}
