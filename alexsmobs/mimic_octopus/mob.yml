#===============================================================
# MIMIC OCTOPUS (Alex's Mobs)
# HP=12 DMG=2 SPD=0.2
#===============================================================
mimic_octopus:
  Type: squid
  Display: '&fMimic Octopus'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 12
  Damage: 2
  MovementSpeed: 0.2
  Faction: creature_mimic_octopus
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - mimic_octopus_ai
  AITargetSelectors:
    - clear
    - mimic_octopus_targets
  Drops:
    - mimic_octopus_drops
  Skills:
    - onTimer:10
    - skill:mimic_octopus_tick @self
    - onSpawn:
      - skill:mimic_octopus_init @self
    - onDeath:
      - skill:mimic_octopus_death @self
    - onDamaged:
      - skill:mimic_octopus_on_hurt @self
