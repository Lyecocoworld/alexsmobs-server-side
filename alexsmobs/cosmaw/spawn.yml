# COSMAW — Spawn

cosmaw_spawner:
  Type: cosmaw
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=THE_END,END_BARRENS,END_HIGHLANDS,END_MIDLANDS}
    - height{h=0to100}
    - lightlevel{l=0to15}
    - worldtype{wt=END}
    - blocktype{m=END_STONE,WATER} @origin
    - playerdistance{d=>24}
