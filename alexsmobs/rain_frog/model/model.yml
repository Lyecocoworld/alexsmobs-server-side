# RAIN FROG — BetterModel

model:
  bettermodel_id: "alexsmobs:rain_frog"
  type: "frog"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/rain_frog.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/rain_frog.png"
  animations:
    idle: "animation.rain_frog.idle"
    walk: "animation.rain_frog.walk"
    run: "animation.rain_frog.run"
    sit: "animation.rain_frog.sit"
    death: "animation.rain_frog.death"
  animation_state_mapping:
    idle: {"animation": "idle", "texture": "normal", "loop": true}
    walk: {"animation": "walk", "texture": "normal", "loop": true}
    run: {"animation": "run", "texture": "normal", "loop": true}
    sit: {"animation": "sit", "texture": "normal", "loop": true}
    death: {"animation": "death", "texture": "normal", "loop": false, "duration": 20}
  scale:
    adult: 1.0
    baby: 0.5
