# ORCA — Spawn

orca_spawner:
  Type: orca
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=COLD_OCEAN,DEEP_COLD_OCEAN,FROZEN_OCEAN,DEEP_FROZEN_OCEAN,OCEAN}
    - height{h=0to60}
    - lightlevel{l=0to15}
    - worldtype{wt=OVERWORLD}
    - blocktype{m=WATER,GRAVEL,SAND} @origin
    - playerdistance{d=>24}
