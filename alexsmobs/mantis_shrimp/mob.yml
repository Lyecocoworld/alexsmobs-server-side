# ===============================================================
# MANTIS SHRIMP (Alex's Mobs)
# Classification: C2 (tamable)
# HP=20 DMG=3 SPD=0.3
# ===============================================================
mantis_shrimp:
  Type: axolotl
  Display: '&fMantis Shrimp'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 20
  Damage: 3
  MovementSpeed: 0.3
  Faction: creature_mantis_shrimp
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - mantis_shrimp_ai
  AITargetSelectors:
    - clear
    - mantis_shrimp_targets
  Drops:
    - mantis_shrimp_drops
  Skills:
    - onTimer:10
    - skill:mantis_shrimp_tick @self
    - onSpawn:
      - skill:mantis_shrimp_init @self
    - onDeath:
      - skill:mantis_shrimp_death @self
    - onDamaged:
      - skill:mantis_shrimp_on_hurt @self
    - onInteract:
      - skill:mantis_shrimp_on_interact @self
