#===============================================================
# SEA BEAR (Alex's Mobs)
# HP=30 DMG=5 SPD=0.3
#===============================================================
sea_bear:
  Type: dolphin
  Display: '&fSea Bear'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 30
  Damage: 5
  MovementSpeed: 0.3
  Faction: creature_sea_bear
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - sea_bear_ai
  AITargetSelectors:
    - clear
    - sea_bear_targets
  Drops:
    - sea_bear_drops
  Skills:
    - onTimer:10
    - skill:sea_bear_tick @self
    - onSpawn:
      - skill:sea_bear_init @self
    - onDeath:
      - skill:sea_bear_death @self
    - onDamaged:
      - skill:sea_bear_on_hurt @self
