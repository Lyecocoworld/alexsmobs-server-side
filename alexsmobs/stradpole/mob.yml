#===============================================================
# STRADPOLE (Alex's Mobs)
# HP=4 DMG=1 SPD=0.2
#===============================================================
stradpole:
  Type: cod
  Display: '&fStradpole'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 4
  Damage: 1
  MovementSpeed: 0.2
  Faction: creature_stradpole
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - stradpole_ai
  AITargetSelectors:
    - clear
    - stradpole_targets
  Drops:
    - stradpole_drops
  Skills:
    - onTimer:10
    - skill:stradpole_tick @self
    - onSpawn:
      - skill:stradpole_init @self
    - onDeath:
      - skill:stradpole_death @self
    - onDamaged:
      - skill:stradpole_on_hurt @self
