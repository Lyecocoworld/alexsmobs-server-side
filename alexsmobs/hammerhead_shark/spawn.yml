# HAMMERHEAD SHARK — Spawn

hammerhead_shark_spawner:
  Type: hammerhead_shark
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=OCEAN,WARM_OCEAN,LUKEWARM_OCEAN,DEEP_OCEAN}
