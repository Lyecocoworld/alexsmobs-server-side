#===============================================================
# FLYING FISH (Alex's Mobs)
# HP=5 DMG=0 SPD=0.3
#===============================================================
flying_fish:
  Type: cod
  Display: '&fFlying Fish'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 5
  Damage: 0
  MovementSpeed: 0.3
  Faction: creature_flying_fish
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - flying_fish_ai
  AITargetSelectors:
    - clear
    - flying_fish_targets
  Drops:
    - flying_fish_drops
  Skills:
    - onTimer:10
    - skill:flying_fish_tick @self
    - onSpawn:
      - skill:flying_fish_init @self
    - onDeath:
      - skill:flying_fish_death @self
    - onDamaged:
      - skill:flying_fish_on_hurt @self
