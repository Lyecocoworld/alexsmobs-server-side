# FLYING FISH — Spawn

flying_fish_spawner:
  Type: flying_fish
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=OCEAN,WARM_OCEAN,LUKEWARM_OCEAN}
    - height{h=40to80}
    - lightlevel{l=0to15}
    - worldtype{wt=OVERWORLD}
    - blocktype{m=WATER} @origin
    - playerdistance{d=>24}
