# ANACONDA — Spawn

anaconda_spawner:
  Type: anaconda
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=SWAMP,MANGROVE_SWAMP,JUNGLE,RIVER}
    - height{h=50to100}
    - lightlevel{l=0to15}
    - worldtype{wt=OVERWORLD}
    - blocktype{m=GRASS_BLOCK,DIRT,SAND,MUD,WATER} @origin
    - playerdistance{d=>24}
