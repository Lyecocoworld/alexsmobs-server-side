# GAZELLE — Spawn

gazelle_spawner:
  Type: gazelle
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=SAVANNA,SAVANNA_PLATEAU,PLAINS,SUNFLOWER_PLAINS,MEADOW}
    - height{h=60to150}
    - lightlevel{l=0to15}
    - worldtype{wt=OVERWORLD}
    - blocktype{m=GRASS_BLOCK,DIRT,COARSE_DIRT} @origin
    - playerdistance{d=>24}
