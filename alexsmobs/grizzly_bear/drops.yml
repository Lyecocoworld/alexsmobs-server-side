# ════════════════════════════════════════════════════════════════
# GRIZZLY BEAR — Drops
# ─────────────────────────────────────────────────────────────────
# Source: pas de loot table explicite dans EntityGrizzlyBear.java
# Le mod utilise les loot tables JSON dans data/alexsmobs/loot_tables/
# Drops principaux: BEAR_FUR (item custom), exp
# ════════════════════════════════════════════════════════════════

grizzly_bear_drops:
  Conditions:
    - playerkill{}                    # Seulement si tué par un joueur
  Drops:
    # BEAR_FUR — item custom Alex's Mobs (CraftEngine)
    # Drop régulier à ~30%
    - alexsmobs:bear_fur 1-2 0.3

    # SAUMON — parfois porté dans la main
    - SALMON 0-1 0.1

    # Expérience (mod: 1-3 par kill)
    - exp{amount=1-3} 1.0
