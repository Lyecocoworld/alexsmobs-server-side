# EMU — Spawn

emu_spawner:
  Type: emu
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
    - biome{b=SAVANNA,SAVANNA_PLATEAU,WINDSWEPT_SAVANNA,BADLANDS}
    - height{h=60to150}
    - lightlevel{l=0to15}
    - worldtype{wt=OVERWORLD}
    - blocktype{m=GRASS_BLOCK,DIRT,COARSE_DIRT,RED_SAND} @origin
    - playerdistance{d=>24}
