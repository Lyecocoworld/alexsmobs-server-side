    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 38
  Damage: 8
  MovementSpeed: 0.25
  Faction: creature_giant_squid
