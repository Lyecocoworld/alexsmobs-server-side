# BANANA SLUG — Skills

banana_slug_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

banana_slug_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

banana_slug_on_hurt:
  Skills: []

banana_slug_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.banana_slug.die;v=1.0;p=0.8-1.2} @self
