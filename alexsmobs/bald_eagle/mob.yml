# ===============================================================
# BALD EAGLE (Alex's Mobs)
# Classification: C2 (tamable)
# HP=16 DMG=5 SPD=0.3
# ===============================================================
bald_eagle:
  Type: parrot
  Display: '&fBald Eagle'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 16
  Damage: 5
  MovementSpeed: 0.3
  Faction: creature_bald_eagle
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - bald_eagle_ai
  AITargetSelectors:
    - clear
    - bald_eagle_targets
  Drops:
    - bald_eagle_drops
  Skills:
    - onTimer:10
    - skill:bald_eagle_tick @self
    - onSpawn:
      - skill:bald_eagle_init @self
    - onDeath:
      - skill:bald_eagle_death @self
    - onDamaged:
      - skill:bald_eagle_on_hurt @self
    - onInteract:
      - skill:bald_eagle_on_interact @self
