#===============================================================
# FLUTTER (Alex's Mobs)
# HP=4 DMG=0 SPD=0.3
#===============================================================
flutter:
  Type: parrot
  Display: '&fFlutter'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 4
  Damage: 0
  MovementSpeed: 0.3
  Faction: creature_flutter
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - flutter_ai
  AITargetSelectors:
    - clear
    - flutter_targets
  Drops:
    - flutter_drops
  Skills:
    - onTimer:10
    - skill:flutter_tick @self
    - onSpawn:
      - skill:flutter_init @self
    - onDeath:
      - skill:flutter_death @self
    - onDamaged:
      - skill:flutter_on_hurt @self
