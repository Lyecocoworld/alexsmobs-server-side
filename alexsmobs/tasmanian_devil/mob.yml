#===============================================================
# TASMANIAN DEVIL (Alex's Mobs)
# HP=12 DMG=3 SPD=0.3
#===============================================================
tasmanian_devil:
  Type: wolf
  Display: '&fTasmanian Devil'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 12
  Damage: 3
  MovementSpeed: 0.3
  Faction: creature_tasmanian_devil
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - tasmanian_devil_ai
  AITargetSelectors:
    - clear
    - tasmanian_devil_targets
  Drops:
    - tasmanian_devil_drops
  Skills:
    - onTimer:10
    - skill:tasmanian_devil_tick @self
    - onSpawn:
      - skill:tasmanian_devil_init @self
    - onDeath:
      - skill:tasmanian_devil_death @self
    - onDamaged:
      - skill:tasmanian_devil_on_hurt @self
