#===============================================================
# UNDERMINER (Alex's Mobs)
# HP=20 DMG=3 SPD=0.25
#===============================================================
underminer:
  Type: zombie
  Display: '&fUnderminer'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 20
  Damage: 3
  MovementSpeed: 0.25
  Faction: creature_underminer
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - underminer_ai
  AITargetSelectors:
    - clear
    - underminer_targets
  Drops:
    - underminer_drops
  Skills:
    - onTimer:10
    - skill:underminer_tick @self
    - onSpawn:
      - skill:underminer_init @self
    - onDeath:
      - skill:underminer_death @self
    - onDamaged:
      - skill:underminer_on_hurt @self
