plugins {
    id 'java'
}

group = 'com.lyecocoworld'
version = '1.2.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

processResources {
    filter {
        it.replace('${project.version}', project.version.toString())
    }
}

jar {
    archiveBaseName.set('AlexMobsServerSide')
    archiveClassifier.set('')

    from('alexsmobs') { into('alexsmobs') }
    from('craftengine') { into('craftengine') }
    from('assets') { into('assets') }
    from('data') { into('data') }
    from('worldgen_datapack') { into('worldgen_datapack/natures_spirit') }
    from('larion_worldgen_datapack') { into('worldgen_datapack/larion') }

    // IMPORTANT: Exclude horizon.plugin.json — Paper detects it and tries
    // to load as a Horizon plugin, which breaks the standard classloader.
    // Only include it when building with the Horizon Gradle plugin.
    exclude 'horizon.plugin.json'
    exclude 'mixins.larion.json'
}

build {
    dependsOn(jar)
}
