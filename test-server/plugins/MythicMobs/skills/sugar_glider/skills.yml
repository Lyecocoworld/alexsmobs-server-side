# SUGAR GLIDER — Skills

sugar_glider_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

sugar_glider_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

sugar_glider_on_hurt:
  Skills: []

sugar_glider_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.sugar_glider.die;v=1.0;p=0.8-1.2} @self
