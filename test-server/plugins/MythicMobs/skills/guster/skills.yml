# GUSTER — Skills

guster_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

guster_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

guster_on_hurt:
  Skills: []

guster_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.guster.die;v=1.0;p=0.8-1.2} @self
