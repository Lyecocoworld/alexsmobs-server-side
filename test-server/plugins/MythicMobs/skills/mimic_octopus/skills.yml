# MIMIC OCTOPUS — Skills

mimic_octopus_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

mimic_octopus_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

mimic_octopus_on_hurt:
  Skills: []

mimic_octopus_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.mimic_octopus.die;v=1.0;p=0.8-1.2} @self
