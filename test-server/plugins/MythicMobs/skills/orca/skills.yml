# ORCA — Skills

orca_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

orca_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

orca_on_hurt:
  Skills: []

orca_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.orca.die;v=1.0;p=0.8-1.2} @self
