# BLUE JAY — Skills

blue_jay_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

blue_jay_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

blue_jay_on_hurt:
  Skills: []

blue_jay_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.blue_jay.die;v=1.0;p=0.8-1.2} @self
