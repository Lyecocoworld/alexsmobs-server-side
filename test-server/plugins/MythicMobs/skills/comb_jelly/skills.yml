# COMB JELLY — Skills

comb_jelly_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

comb_jelly_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

comb_jelly_on_hurt:
  Skills: []

comb_jelly_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.comb_jelly.die;v=1.0;p=0.8-1.2} @self
