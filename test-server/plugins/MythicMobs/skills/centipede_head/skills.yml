# CENTIPEDE — Skills

centipede_head_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

centipede_head_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

centipede_head_on_hurt:
  Skills: []

centipede_head_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.centipede_head.die;v=1.0;p=0.8-1.2} @self
