# TASMANIAN DEVIL — Skills

tasmanian_devil_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

tasmanian_devil_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

tasmanian_devil_on_hurt:
  Skills: []

tasmanian_devil_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.tasmanian_devil.die;v=1.0;p=0.8-1.2} @self
