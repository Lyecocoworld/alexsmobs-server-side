# FLYING FISH — Skills

flying_fish_tick:
  Skills:
    - effect:particle{p=SMOKE;a=1;hs=0.3;vs=0.3;speed=0.02} @origin
      ?random{chance=0.001}

flying_fish_init:
  Skills:
    - setstance{stance=idle}
    - setmodelstate{state=idle}

flying_fish_on_hurt:
  Skills: []

flying_fish_death:
  Skills:
    - setmodelstate{state=death}
    - sound{s=alexsmobs:entity.flying_fish.die;v=1.0;p=0.8-1.2} @self
