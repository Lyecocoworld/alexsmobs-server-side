# ===============================================================
# GAZELLE (Alex's Mobs)
# HP=12 DMG=2 SPD=0.3
# ===============================================================
gazelle:
  Type: cow
  Display: '&fGazelle'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 12
  Damage: 2
  MovementSpeed: 0.3
  Faction: creature_gazelle
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - gazelle_ai
  AITargetSelectors:
    - clear
    - gazelle_targets
  Drops:
    - gazelle_drops
  Skills:
    - onTimer:10
    - skill:gazelle_tick @self
    - onSpawn:
      - skill:gazelle_init @self
    - onDeath:
      - skill:gazelle_death @self
    - onDamaged:
      - skill:gazelle_on_hurt @self
