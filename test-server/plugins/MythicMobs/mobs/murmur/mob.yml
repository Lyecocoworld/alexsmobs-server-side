# ===============================================================
# MURMUR (Alex's Mobs)
# HP=30 DMG=3 SPD=0.2
# ===============================================================
murmur:
  Type: warden
  Display: '&fMurmur'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 30
  Damage: 3
  MovementSpeed: 0.2
  Faction: creature_murmur
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - murmur_ai
  AITargetSelectors:
    - clear
    - murmur_targets
  Drops:
    - murmur_drops
  Skills:
    - onTimer:10
    - skill:murmur_tick @self
    - onSpawn:
      - skill:murmur_init @self
    - onDeath:
      - skill:murmur_death @self
    - onDamaged:
      - skill:murmur_on_hurt @self
