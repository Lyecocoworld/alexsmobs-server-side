#===============================================================
# GELADA MONKEY (Alex's Mobs)
# HP=16 DMG=2 SPD=0.25
#===============================================================
gelada_monkey:
  Type: fox
  Display: '&fGelada Monkey'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 16
  Damage: 2
  MovementSpeed: 0.25
  Faction: creature_gelada_monkey
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - gelada_monkey_ai
  AITargetSelectors:
    - clear
    - gelada_monkey_targets
  Drops:
    - gelada_monkey_drops
  Skills:
    - onTimer:10
    - skill:gelada_monkey_tick @self
    - onSpawn:
      - skill:gelada_monkey_init @self
    - onDeath:
      - skill:gelada_monkey_death @self
    - onDamaged:
      - skill:gelada_monkey_on_hurt @self
