# FRILLED SHARK (Alex's Mobs)
# HP=25 DMG=4 SPD=0.2
#===============================================================
frilled_shark:
  Type: cod
  Display: '&fFrilled Shark'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 25
  Damage: 4
  MovementSpeed: 0.2
  Faction: creature_frilled_shark
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - frilled_shark_ai
  AITargetSelectors:
    - clear
    - frilled_shark_targets
  Drops:
    - frilled_shark_drops
  Skills:
    - onTimer:10
    - skill:frilled_shark_tick @self
    - onSpawn:
      - skill:frilled_shark_init @self
    - onDeath:
      - skill:frilled_shark_death @self
    - onDamaged:
      - skill:frilled_shark_on_hurt @self
