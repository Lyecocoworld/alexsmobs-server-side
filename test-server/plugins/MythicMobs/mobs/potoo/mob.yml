#===============================================================
# POTOO (Alex's Mobs)
# HP=8 DMG=1 SPD=0.2
#===============================================================
potoo:
  Type: parrot
  Display: '&fPotoo'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 8
  Damage: 1
  MovementSpeed: 0.2
  Faction: creature_potoo
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - potoo_ai
  AITargetSelectors:
    - clear
    - potoo_targets
  Drops:
    - potoo_drops
  Skills:
    - onTimer:10
    - skill:potoo_tick @self
    - onSpawn:
      - skill:potoo_init @self
    - onDeath:
      - skill:potoo_death @self
    - onDamaged:
      - skill:potoo_on_hurt @self
