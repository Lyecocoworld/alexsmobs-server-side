# ===============================================================
# TUSKLIN (Alex's Mobs)
# HP=40 DMG=9 SPD=0.3
# ===============================================================
tusklin:
  Type: cow
  Display: '&fTusklin'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 40
  Damage: 9
  MovementSpeed: 0.3
  Faction: creature_tusklin
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - tusklin_ai
  AITargetSelectors:
    - clear
    - tusklin_targets
  Drops:
    - tusklin_drops
  Skills:
    - onTimer:10
    - skill:tusklin_tick @self
    - onSpawn:
      - skill:tusklin_init @self
    - onDeath:
      - skill:tusklin_death @self
    - onDamaged:
      - skill:tusklin_on_hurt @self
