#===============================================================
# SEAGULL (Alex's Mobs)
# HP=8 DMG=1 SPD=0.3
#===============================================================
seagull:
  Type: parrot
  Display: '&fSeagull'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 8
  Damage: 1
  MovementSpeed: 0.3
  Faction: creature_seagull
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - seagull_ai
  AITargetSelectors:
    - clear
    - seagull_targets
  Drops:
    - seagull_drops
  Skills:
    - onTimer:10
    - skill:seagull_tick @self
    - onSpawn:
      - skill:seagull_init @self
    - onDeath:
      - skill:seagull_death @self
    - onDamaged:
      - skill:seagull_on_hurt @self
