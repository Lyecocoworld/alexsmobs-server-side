# ===============================================================
# MOOSE (Alex's Mobs)
# HP=32 DMG=6 SPD=0.25
# ===============================================================
moose:
  Type: cow
  Display: '&fMoose'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 32
  Damage: 6
  MovementSpeed: 0.25
  Faction: creature_moose
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - moose_ai
  AITargetSelectors:
    - clear
    - moose_targets
  Drops:
    - moose_drops
  Skills:
    - onTimer:10
    - skill:moose_tick @self
    - onSpawn:
      - skill:moose_init @self
    - onDeath:
      - skill:moose_death @self
    - onDamaged:
      - skill:moose_on_hurt @self
