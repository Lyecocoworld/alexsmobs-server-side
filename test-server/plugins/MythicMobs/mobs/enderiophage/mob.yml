# ===============================================================
# ENDERIOPHAGE (Alex's Mobs)
# HP=20 DMG=2 SPD=0.15
# ===============================================================
enderiophage:
  Type: phantom
  Display: '&fEnderiophage'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 20
  Damage: 2
  MovementSpeed: 0.15
  Faction: creature_enderiophage
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - enderiophage_ai
  AITargetSelectors:
    - clear
    - enderiophage_targets
  Drops:
    - enderiophage_drops
  Skills:
    - onTimer:10
    - skill:enderiophage_tick @self
    - onSpawn:
      - skill:enderiophage_init @self
    - onDeath:
      - skill:enderiophage_death @self
    - onDamaged:
      - skill:enderiophage_on_hurt @self
