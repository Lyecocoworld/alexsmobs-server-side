#===============================================================
# SKREECHER (Alex's Mobs)
# HP=12 DMG=2 SPD=0.2
#===============================================================
skreecher:
  Type: warden
  Display: '&fSkreecher'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 12
  Damage: 2
  MovementSpeed: 0.2
  Faction: creature_skreecher
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - skreecher_ai
  AITargetSelectors:
    - clear
    - skreecher_targets
  Drops:
    - skreecher_drops
  Skills:
    - onTimer:10
    - skill:skreecher_tick @self
    - onSpawn:
      - skill:skreecher_init @self
    - onDeath:
      - skill:skreecher_death @self
    - onDamaged:
      - skill:skreecher_on_hurt @self
