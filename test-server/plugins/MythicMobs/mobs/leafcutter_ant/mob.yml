#===============================================================
# LEAFCUTTER ANT (Alex's Mobs)
# HP=3 DMG=1 SPD=0.2
#===============================================================
leafcutter_ant:
  Type: silverfish
  Display: '&fLeafcutter Ant'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 3
  Damage: 1
  MovementSpeed: 0.2
  Faction: creature_leafcutter_ant
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - leafcutter_ant_ai
  AITargetSelectors:
    - clear
    - leafcutter_ant_targets
  Drops:
    - leafcutter_ant_drops
  Skills:
    - onTimer:10
    - skill:leafcutter_ant_tick @self
    - onSpawn:
      - skill:leafcutter_ant_init @self
    - onDeath:
      - skill:leafcutter_ant_death @self
    - onDamaged:
      - skill:leafcutter_ant_on_hurt @self
