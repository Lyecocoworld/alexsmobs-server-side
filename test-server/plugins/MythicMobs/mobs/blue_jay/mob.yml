# ===============================================================
# BLUE JAY (Alex's Mobs)
# HP=6 DMG=1 SPD=0.25
# ===============================================================
blue_jay:
  Type: parrot
  Display: '&fBlue Jay'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 6
  Damage: 1
  MovementSpeed: 0.25
  Faction: creature_blue_jay
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - blue_jay_ai
  AITargetSelectors:
    - clear
    - blue_jay_targets
  Drops:
    - blue_jay_drops
  Skills:
    - onTimer:10
    - skill:blue_jay_tick @self
    - onSpawn:
      - skill:blue_jay_init @self
    - onDeath:
      - skill:blue_jay_death @self
    - onDamaged:
      - skill:blue_jay_on_hurt @self
