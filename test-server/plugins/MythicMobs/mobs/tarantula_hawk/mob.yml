    - tarantula_hawk_ai
  AITargetSelectors:
    - clear
    - tarantula_hawk_targets
  Drops:
    - tarantula_hawk_drops
  Skills:
    - onTimer:10
    - skill:tarantula_hawk_tick @self
    - onSpawn:
      - skill:tarantula_hawk_init @self
    - onDeath:
      - skill:tarantula_hawk_death @self
    - onDamaged:
      - skill:tarantula_hawk_on_hurt @self
