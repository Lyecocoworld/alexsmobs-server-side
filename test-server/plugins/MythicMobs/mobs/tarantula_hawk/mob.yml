    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 12
  Damage: 3
  MovementSpeed: 0.35
  Faction: creature_tarantula_hawk
