#===============================================================
# GUSTER (Alex's Mobs)
# HP=16 DMG=3 SPD=0.3
#===============================================================
guster:
  Type: vex
  Display: '&fGuster'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 16
  Damage: 3
  MovementSpeed: 0.3
  Faction: creature_guster
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - guster_ai
  AITargetSelectors:
    - clear
    - guster_targets
  Drops:
    - guster_drops
  Skills:
    - onTimer:10
    - skill:guster_tick @self
    - onSpawn:
      - skill:guster_init @self
    - onDeath:
      - skill:guster_death @self
    - onDamaged:
      - skill:guster_on_hurt @self
