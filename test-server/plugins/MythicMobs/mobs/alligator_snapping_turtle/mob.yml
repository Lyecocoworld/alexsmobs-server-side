#===============================================================
# ALLIGATOR SNAPPING TURTLE (Alex's Mobs)
# HP=30 DMG=5 SPD=0.15
#===============================================================
alligator_snapping_turtle:
  Type: turtle
  Display: '&fAlligator Snapping Turtle'
  Modules:
    ThreatTable: true
    AIGoalSelectors: true
    AITargetSelectors: true
    DamageModifiers: true
    ImmunityTable: true
  Health: 30
  Damage: 5
  MovementSpeed: 0.15
  Faction: creature_alligator_snapping_turtle
  Options:
    Persistent: true
    FollowRange: 32
    Silent: true
    Despawn: true
    Ageable:
      BabyAge: 20000
    PreventRandomEquipment: true
  AIGoalSelectors:
    - clear
    - alligator_snapping_turtle_ai
  AITargetSelectors:
    - clear
    - alligator_snapping_turtle_targets
  Drops:
    - alligator_snapping_turtle_drops
  Skills:
    - onTimer:10
    - skill:alligator_snapping_turtle_tick @self
    - onSpawn:
      - skill:alligator_snapping_turtle_init @self
    - onDeath:
      - skill:alligator_snapping_turtle_death @self
    - onDamaged:
      - skill:alligator_snapping_turtle_on_hurt @self
