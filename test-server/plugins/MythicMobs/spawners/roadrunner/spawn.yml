# ROADRUNNER — Spawn

roadrunner_spawner:
  Type: roadrunner
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
  - biome{b=DESERT,BADLANDS,ERODED_BADLANDS,WOODED_BADLANDS}
  - height{h=60to150}
  - lightlevel{l=0to15}
  - worldtype{wt=OVERWORLD}
  - blocktype{m=SAND,RED_SAND,SANDSTONE,TERRACOTTA,GRASS_BLOCK} @origin
  - playerdistance{d=>24}
  MobName: ''
  CooldownTimer: 0
  WarmupTimer: 0
  ActiveMobs: 0
