# UNDERMINER — Spawn

underminer_spawner:
  Type: underminer
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
  - biome{b=DRIPSTONE_CAVES,LUSH_CAVES,DEEP_DARK}
  - height{h=-64to0}
  - lightlevel{l=0to15}
  - worldtype{wt=OVERWORLD}
  - blocktype{m=STONE,DEEPSLATE,DRIPSTONE_BLOCK,MOSS_BLOCK} @origin
  - playerdistance{d=>24}
  MobName: ''
  CooldownTimer: 0
  WarmupTimer: 0
  ActiveMobs: 0
