# TERRAPIN — Spawn

terrapin_spawner:
  Type: terrapin
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
  - biome{b=SWAMP,MANGROVE_SWAMP,RIVER}
  - height{h=50to80}
  - lightlevel{l=0to15}
  - worldtype{wt=OVERWORLD}
  - blocktype{m=WATER,GRASS_BLOCK,SAND,MUD} @origin
  - playerdistance{d=>24}
  MobName: ''
  CooldownTimer: 0
  WarmupTimer: 0
  ActiveMobs: 0
