# SKELEWAG — Spawn

skelewag_spawner:
  Type: skelewag
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
  - biome{b=COLD_OCEAN,DEEP_COLD_OCEAN,OCEAN,DEEP_OCEAN}
  - height{h=0to50}
  - lightlevel{l=0to15}
  - worldtype{wt=OVERWORLD}
  - blocktype{m=WATER,GRAVEL,SAND,CLAY} @origin
  - playerdistance{d=>24}
  MobName: ''
  CooldownTimer: 0
  WarmupTimer: 0
  ActiveMobs: 0
