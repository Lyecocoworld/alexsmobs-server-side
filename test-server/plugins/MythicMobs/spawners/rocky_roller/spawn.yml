# ROCKY ROLLER — Spawn

rocky_roller_spawner:
  Type: rocky_roller
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
  - biome{b=WINDSWEPT_HILLS,WINDSWEPT_GRAVELY_HILLS,WINDSWEPT_FOREST,STONY_SHORE,STONY_PEAKS}
