  - lightlevel{l=0to15}
  - worldtype{wt=OVERWORLD}
  - blocktype{m=GRASS_BLOCK,DIRT,PODZOL,SNOW_BLOCK} @origin
  - playerdistance{d=>24}
  MobName: ''
  CooldownTimer: 0
  WarmupTimer: 0
  ActiveMobs: 0
