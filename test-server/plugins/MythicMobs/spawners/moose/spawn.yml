# MOOSE — Spawn

moose_spawner:
  Type: moose
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
  - biome{b=TAIGA,OLD_GROWTH_TAIGA,OLD_GROWTH_SPRUCE_TAIGA,SNOWY_TAIGA}
