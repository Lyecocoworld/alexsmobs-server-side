# ════════════════════════════════════════════════════════════════
# CROW — Spawn Configuration
# Source: canCrowSpawn() + AMConfig
# ════════════════════════════════════════════════════════════════

crow_spawner:
  Type: crow
  SpawnRate: 4
  MaxMobs: 4
  CheckTime: true
  CheckDistance: 64
  Conditions:
  - biome{b=PLAINS,SUNFLOWER_PLAINS,FOREST,FLOWER_FOREST, BIRCH_FOREST,DARK_FOREST,OLD_GROWTH_BIRCH_FOREST,
    MEADOW,TAG_HAS_VILLAGE}
  - height{h=60to150}
  - lightlevel{l=7to15}
  - worldtype{wt=OVERWORLD}
  - blocktype{m=GRASS_BLOCK,DIRT,PODZOL,STONE,COARSE_DIRT, FARMLAND,HAY_BLOCK,COMPOSTER}
    @origin
  - playerdistance{d=>24}
  MobName: ''
  CooldownTimer: 0
  WarmupTimer: 0
  ActiveMobs: 0
