# ENDERIOPHAGE — BetterModel

model:
  bettermodel_id: "alexsmobs:enderiophage"
  type: "phantom"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/enderiophage.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/enderiophage.png"
  animations:
    idle: "animation.enderiophage.idle"
    walk: "animation.enderiophage.walk"
    run: "animation.enderiophage.run"
    sit: "animation.enderiophage.sit"
    death: "animation.enderiophage.death"
  animation_state_mapping:
    idle: {"animation": "idle", "texture": "normal", "loop": true}
    walk: {"animation": "walk", "texture": "normal", "loop": true}
    run: {"animation": "run", "texture": "normal", "loop": true}
    sit: {"animation": "sit", "texture": "normal", "loop": true}
    death: {"animation": "death", "texture": "normal", "loop": false, "duration": 20}
  scale:
    adult: 1.0
    baby: 0.5
