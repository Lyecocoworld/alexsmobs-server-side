# STRADDLER — BetterModel

model:
  bettermodel_id: "alexsmobs:straddler"
  type: "zombie"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/straddler.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/straddler.png"
  animations:
    idle: "animation.straddler.idle"
    walk: "animation.straddler.walk"
    run: "animation.straddler.run"
    sit: "animation.straddler.sit"
    death: "animation.straddler.death"
    launch: "animation.straddler.launch"

  animation_state_mapping:
    idle: {"animation": "idle", "texture": "normal", "loop": true}
    walk: {"animation": "walk", "texture": "normal", "loop": true}
    run: {"animation": "run", "texture": "normal", "loop": true}
    sit: {"animation": "sit", "texture": "normal", "loop": true}
    death: {"animation": "death", "texture": "normal", "loop": true}
    launch: {"animation": "launch", "texture": "normal", "loop": false, "duration": 30}

  scale:
    adult: 1.0
    baby: 0.5
