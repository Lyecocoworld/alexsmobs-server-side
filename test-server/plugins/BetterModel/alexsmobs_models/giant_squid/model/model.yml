# GIANT SQUID — BetterModel

model:
  bettermodel_id: "alexsmobs:giant_squid"
  type: "squid"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/giant_squid.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/giant_squid.png"
  animations:
    idle: "animation.giant_squid.idle"
