# EMU — BetterModel

model:
  bettermodel_id: "alexsmobs:emu"
  type: "chicken"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/emu.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/emu.png"
  animations:
    idle: "animation.emu.idle"
    walk: "animation.emu.walk"
    run: "animation.emu.run"
    sit: "animation.emu.sit"
    death: "animation.emu.death"
    dodge_left: "animation.emu.dodge_left"
    dodge_right: "animation.emu.dodge_right"
    peck_ground: "animation.emu.peck_ground"
    scratch: "animation.emu.scratch"
    puzzled: "animation.emu.puzzled"

  animation_state_mapping:
    idle: {"animation": "idle", "texture": "normal", "loop": true}
    walk: {"animation": "walk", "texture": "normal", "loop": true}
    run: {"animation": "run", "texture": "normal", "loop": true}
    sit: {"animation": "sit", "texture": "normal", "loop": true}
    death: {"animation": "death", "texture": "normal", "loop": true}
    dodge_left: {"animation": "dodge_left", "texture": "normal", "loop": false, "duration": 10}
    dodge_right: {"animation": "dodge_right", "texture": "normal", "loop": false, "duration": 10}
    peck_ground: {"animation": "peck_ground", "texture": "normal", "loop": false, "duration": 25}
    scratch: {"animation": "scratch", "texture": "normal", "loop": false, "duration": 20}
    puzzled: {"animation": "puzzled", "texture": "normal", "loop": false, "duration": 30}

  scale:
    adult: 1.0
    baby: 0.5
