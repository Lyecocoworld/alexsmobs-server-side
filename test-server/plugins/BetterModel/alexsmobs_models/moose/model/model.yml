# MOOSE — BetterModel

model:
  bettermodel_id: "alexsmobs:moose"
  type: "cow"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/moose.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/moose.png"
  animations:
    idle: "animation.moose.idle"
    walk: "animation.moose.walk"
    run: "animation.moose.run"
    sit: "animation.moose.sit"
    death: "animation.moose.death"
  animation_state_mapping:
    idle: {"animation": "idle", "texture": "normal", "loop": true}
    walk: {"animation": "walk", "texture": "normal", "loop": true}
    run: {"animation": "run", "texture": "normal", "loop": true}
    sit: {"animation": "sit", "texture": "normal", "loop": true}
    death: {"animation": "death", "texture": "normal", "loop": false, "duration": 20}
  scale:
    adult: 1.0
    baby: 0.5
