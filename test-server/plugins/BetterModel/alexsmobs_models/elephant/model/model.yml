# ELEPHANT — BetterModel

model:
  bettermodel_id: "alexsmobs:elephant"
  type: "horse"
  hitbox:
    width: 1.0
    height: 1.0
  blockbench_model: "assets/alexsmobs/blockbench/elephant.bbmodel"
  textures:
    normal:
      path: "assets/alexsmobs/textures/entity/elephant.png"
  animations:
    idle: "animation.elephant.idle"
    walk: "animation.elephant.walk"
    run: "animation.elephant.run"
    sit: "animation.elephant.sit"
    death: "animation.elephant.death"
  animation_state_mapping:
    idle: {"animation": "idle", "texture": "normal", "loop": true}
    walk: {"animation": "walk", "texture": "normal", "loop": true}
    run: {"animation": "run", "texture": "normal", "loop": true}
    sit: {"animation": "sit", "texture": "normal", "loop": true}
    death: {"animation": "death", "texture": "normal", "loop": false, "duration": 20}
  scale:
    adult: 1.0
    baby: 0.5
